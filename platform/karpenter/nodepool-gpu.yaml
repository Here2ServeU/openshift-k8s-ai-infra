---
# Karpenter NodePool for GPU bursts. See ADR-002.
# Two pools: spot first (cheaper), on-demand as a fallback when spot is
# unavailable. Karpenter uses NodePool `weight` to prefer the first.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-spot
spec:
  template:
    metadata:
      labels:
        workload-type: serving
        nvidia.com/gpu: "true"
    spec:
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [g5, g4dn]
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: In
          values: ["1"]
        - key: karpenter.k8s.aws/instance-gpu-memory
          operator: Gt
          values: ["16000"]   # ≥ 16 GB VRAM
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-default
      expireAfter: 168h        # 7d — force rotation for AMI freshness
  limits:
    cpu: 256
    memory: 1024Gi
    "nvidia.com/gpu": 32
  weight: 100
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-od-fallback
spec:
  template:
    metadata:
      labels:
        workload-type: serving
        nvidia.com/gpu: "true"
    spec:
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [g5, g4dn]
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: In
          values: ["1"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-default
      expireAfter: 168h
  limits:
    cpu: 128
    memory: 512Gi
    "nvidia.com/gpu": 8
  weight: 10                  # lower priority — only used when spot is exhausted
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-default
spec:
  amiFamily: AL2
  amiSelectorTerms:
    - alias: al2@latest
  role: "KarpenterNodeRole-ai-ml-infra"   # provisioned by Terraform Karpenter module
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ai-ml-infra
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ai-ml-infra
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 200Gi             # GPU AMIs + model cache need space
        deleteOnTermination: true
        encrypted: true
  tags:
    workload: gpu-serving
    cost-center: platform
