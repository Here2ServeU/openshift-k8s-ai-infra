apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This kustomize bundle is rendered by the `observability` ArgoCD Application
# (see platform/argocd/apps/08-observability.yaml).
#
# The actual chart installs happen via Argo CD's helm support — these manifests
# are the kustomize-side glue: the Application CRDs that wrap each Helm release.

resources:
  - kube-prometheus-stack.yaml
  - loki.yaml
  - tempo.yaml
  - otel-collector.yaml
  - grafana-dashboards-configmap.yaml
  - prometheus-rules.yaml
  - selfsigned-issuer.yaml

namespace: observability
