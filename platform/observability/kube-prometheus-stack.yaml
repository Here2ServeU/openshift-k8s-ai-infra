---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 62.6.0
    helm:
      values: |
        defaultRules:
          create: true
        prometheus:
          prometheusSpec:
            retention: 15d
            retentionSize: 40GB
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 500m, memory: 2Gi }
              limits:   { cpu: 2,    memory: 4Gi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
            additionalScrapeConfigs:
              - job_name: vllm
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app]
                    action: keep
                    regex: vllm-.*
                  - source_labels: [__meta_kubernetes_pod_container_port_number]
                    action: keep
                    regex: "8000"

        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits:   { cpu: 200m, memory: 256Mi }
          config:
            route:
              receiver: 'default'
              group_by: ['alertname', 'severity']
              routes:
                - matchers: [severity = "critical"]
                  receiver: 'pagerduty'
                  continue: true
                - matchers: [team = "platform"]
                  receiver: 'slack-platform'
            receivers:
              - name: 'default'
              - name: 'pagerduty'
                # Configure via External Secret -> PagerDuty integration key
              - name: 'slack-platform'
                # Configure via External Secret -> Slack webhook

        grafana:
          adminPassword: prom-operator  # local-dev only — override via ESO in cloud
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          persistence:
            enabled: true
            size: 10Gi
          # Datasources — Prom is auto-wired by the chart. Loki + Tempo added here.
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki-gateway.observability.svc:80
              access: proxy
            - name: Tempo
              type: tempo
              url: http://tempo.observability.svc:3100
              access: proxy
              jsonData:
                tracesToLogs:
                  datasourceUid: loki
                  filterByTraceID: true
                tracesToMetrics:
                  datasourceUid: prometheus
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              folder: /tmp/dashboards
              searchNamespace: ALL
            datasources:
              enabled: true

        kubeStateMetrics:
          enabled: true
        nodeExporter:
          enabled: true
        prometheusOperator:
          resources:
            requests: { cpu: 100m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
