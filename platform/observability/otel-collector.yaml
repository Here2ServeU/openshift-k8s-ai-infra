---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.105.1
    helm:
      values: |
        mode: daemonset
        image:
          repository: otel/opentelemetry-collector-contrib
        # See ADR-005 — single ingestion point. OTLP receivers for apps,
        # Prom receiver for /metrics endpoints that don't speak OTLP yet.
        config:
          receivers:
            otlp:
              protocols:
                grpc: { endpoint: 0.0.0.0:4317 }
                http: { endpoint: 0.0.0.0:4318 }
            prometheus:
              config:
                scrape_configs:
                  - job_name: dcgm
                    kubernetes_sd_configs: [{ role: pod }]
                    relabel_configs:
                      - source_labels: [__meta_kubernetes_pod_label_app]
                        action: keep
                        regex: nvidia-dcgm-exporter
            kubeletstats:
              auth_type: serviceAccount
              endpoint: "https://${env:K8S_NODE_NAME}:10250"
              insecure_skip_verify: true
              collection_interval: 30s
          processors:
            batch: {}
            memory_limiter:
              check_interval: 1s
              limit_percentage: 75
              spike_limit_percentage: 15
            # Tail-based sampling — keep errors + slow, 10% of normal.
            tail_sampling:
              decision_wait: 10s
              num_traces: 50000
              policies:
                - name: errors
                  type: status_code
                  status_code: { status_codes: [ERROR] }
                - name: slow
                  type: latency
                  latency: { threshold_ms: 1000 }
                - name: gen-ai-always
                  type: string_attribute
                  string_attribute:
                    key: gen_ai.system
                    values: [vllm, openai, anthropic]
                - name: probabilistic
                  type: probabilistic
                  probabilistic: { sampling_percentage: 10 }
            attributes:
              actions:
                # Enforce a label allow-list — high cardinality kills Prom.
                - key: pod_template_hash
                  action: delete
                - key: controller_revision_hash
                  action: delete
          exporters:
            otlphttp/loki:
              endpoint: http://loki-gateway.observability.svc:80/otlp
            otlp/tempo:
              endpoint: tempo.observability.svc:4317
              tls: { insecure: true }
            prometheusremotewrite:
              endpoint: http://prometheus-operated.observability.svc:9090/api/v1/write
              resource_to_telemetry_conversion: { enabled: true }
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, tail_sampling, attributes, batch]
                exporters: [otlp/tempo]
              metrics:
                receivers: [otlp, prometheus, kubeletstats]
                processors: [memory_limiter, attributes, batch]
                exporters: [prometheusremotewrite]
              logs:
                receivers: [otlp]
                processors: [memory_limiter, attributes, batch]
                exporters: [otlphttp/loki]
            telemetry:
              metrics:
                address: 0.0.0.0:8888
        ports:
          jaeger-compact: { enabled: false }
          jaeger-grpc:    { enabled: false }
          jaeger-thrift:  { enabled: false }
          zipkin:         { enabled: false }
        presets:
          kubernetesAttributes: { enabled: true }
          hostMetrics: { enabled: true }
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
