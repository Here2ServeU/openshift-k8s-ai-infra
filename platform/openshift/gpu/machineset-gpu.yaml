---
# GPU MachineSet — node capacity for GPU workloads on ROSA / self-managed OpenShift.
#
# On EKS/GKE we let Karpenter / GKE-NAP provision spot GPU nodes on demand (ADR-002).
# OpenShift's equivalent is the MachineSet + cluster-autoscaler: the MachineSet defines
# the instance shape and the autoscaler scales it between min/max. (Karpenter-for-OpenShift
# is not GA; the MachineAPI is the supported path — see ADR-010.)
#
# PLACEHOLDERS to replace from your cluster:
#   <infra-id>   -> oc get infrastructure cluster -o jsonpath='{.status.infrastructureName}'
#   <region>     -> e.g. us-east-1
#   <az>         -> e.g. us-east-1a
# This example is AWS (ROSA). The ARO/vSphere shape differs but the labels/taints are identical.
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: <infra-id>-gpu-<az>
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: <infra-id>
  annotations:
    # cluster-autoscaler bounds — scale-to-zero when no GPU pods are pending.
    machine.openshift.io/cluster-api-autoscaler-node-group-min-size: "0"
    machine.openshift.io/cluster-api-autoscaler-node-group-max-size: "4"
spec:
  replicas: 0
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: <infra-id>
      machine.openshift.io/cluster-api-machineset: <infra-id>-gpu-<az>
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: <infra-id>
        machine.openshift.io/cluster-api-machineset: <infra-id>-gpu-<az>
    spec:
      metadata:
        labels:
          workload-type: serving
          nvidia.com/gpu.present: "true"
        # Taint so only GPU workloads (with the matching toleration) land here.
        taints:
          - key: nvidia.com/gpu
            value: "true"
            effect: NoSchedule
      providerSpec:
        value:
          apiVersion: machine.openshift.io/v1beta1
          kind: AWSMachineProviderConfig
          instanceType: g5.xlarge          # 1x A10G — matches the cloud GPU profile
          ami:
            id: ""                          # leave blank: inherits the cluster's RHCOS AMI
          placement:
            region: <region>
            availabilityZone: <az>
          subnet:
            filters:
              - name: tag:Name
                values:
                  - <infra-id>-private-<az>
          iamInstanceProfile:
            id: <infra-id>-worker-profile
          securityGroups:
            - filters:
                - name: tag:Name
                  values:
                    - <infra-id>-worker-sg
          # Spot for burst capacity (matches the Karpenter spot story). Drop this
          # block for on-demand if your eval SLAs can't tolerate interruption.
          spotMarketOptions: {}
          blockDevices:
            - ebs:
                volumeSize: 120
                volumeType: gp3
                encrypted: true
          userDataSecret:
            name: worker-user-data
