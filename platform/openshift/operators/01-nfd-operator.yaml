---
# Node Feature Discovery operator. Must be installed and reconciled BEFORE the
# NVIDIA GPU Operator: NFD labels GPU nodes with feature.node.kubernetes.io/pci-10de.present,
# which is the nodeSelector the GPU Operator's driver/device-plugin DaemonSets use.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: nfd
  namespace: openshift-nfd
spec:
  channel: stable
  installPlanApproval: Automatic
  name: nfd
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# NodeFeatureDiscovery CR — created after the operator's CSV reports Succeeded.
# (make ocp-gpu waits on the CSV before applying this.)
apiVersion: nfd.openshift.io/v1
kind: NodeFeatureDiscovery
metadata:
  name: nfd-instance
  namespace: openshift-nfd
spec:
  operand:
    image: registry.redhat.io/openshift4/ose-node-feature-discovery:v4.16
    imagePullPolicy: IfNotPresent
  workerConfig:
    configData: |
      sources:
        pci:
          deviceClassWhitelist:
            - "0200"   # network
            - "03"     # display controllers — captures NVIDIA GPUs (vendor 0x10de)
            - "12"     # processing accelerators
          deviceLabelFields:
            - vendor
