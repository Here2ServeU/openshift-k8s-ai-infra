---
# AWS-only. Karpenter is installed by Terraform (it needs IRSA), but the
# NodePool / EC2NodeClass CRDs are applied via GitOps so we can iterate on them
# without re-running terraform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepools
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR-ORG/k8s-ai-ml-infra
    targetRevision: main
    path: platform/karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
