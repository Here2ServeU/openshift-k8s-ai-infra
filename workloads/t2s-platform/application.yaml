---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t2s-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/T2S/k8s-ai-ml-infra
    targetRevision: main
    path: workloads/t2s-platform
    directory:
      recurse: true
      exclude: application.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: t2s
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
