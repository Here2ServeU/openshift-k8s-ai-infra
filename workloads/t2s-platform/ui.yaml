---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: t2s-ui
  namespace: t2s
  labels:
    app.kubernetes.io/name: t2s-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: t2s-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: t2s-ui
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause:
            duration: 5m
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t2s-ui
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: t2s-platform
    spec:
      serviceAccountName: t2s-ui
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/T2S/t2s-ui:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: /api
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: t2s-ui
  namespace: t2s
  labels:
    app.kubernetes.io/name: t2s-ui
spec:
  selector:
    app.kubernetes.io/name: t2s-ui
  ports:
    - name: http
      port: 80
      targetPort: http
