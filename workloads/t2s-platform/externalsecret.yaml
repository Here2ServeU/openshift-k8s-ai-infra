---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: t2s-runtime
  namespace: t2s
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: workload-secrets
    kind: ClusterSecretStore
  target:
    name: t2s-runtime
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: /t2s/prod/database-url
    - secretKey: redis-url
      remoteRef:
        key: /t2s/prod/redis-url
    - secretKey: eval-queue-url
      remoteRef:
        key: /t2s/prod/eval-queue-url
    - secretKey: artifact-bucket
      remoteRef:
        key: /t2s/prod/artifact-bucket
