---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t2s-worker
  namespace: t2s
  labels:
    app.kubernetes.io/name: t2s-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: t2s-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: t2s-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t2s-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: t2s-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: t2s-worker
      nodeSelector:
        workload-type: batch
      tolerations:
        - key: workload-type
          operator: Equal
          value: batch
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/T2S/t2s-worker:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4317
            - name: OTEL_SERVICE_NAME
              value: t2s-worker
            - name: EVAL_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: t2s-runtime
                  key: eval-queue-url
            - name: ARTIFACT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: t2s-runtime
                  key: artifact-bucket
            - name: MAX_CONCURRENT_EVALS
              value: "4"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: t2s-worker
  namespace: t2s
  labels:
    app.kubernetes.io/name: t2s-worker
spec:
  selector:
    app.kubernetes.io/name: t2s-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: t2s-worker-sqs
  namespace: t2s
spec:
  scaleTargetRef:
    name: t2s-worker
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 50
  fallback:
    failureThreshold: 3
    replicas: 6
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 200
              periodSeconds: 60
            - type: Pods
              value: 10
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Percent
              value: 25
              periodSeconds: 120
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURLFromEnv: EVAL_QUEUE_URL
        queueLength: "10"
        awsRegion: us-east-1
        identityOwner: operator
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.observability.svc:9090
        threshold: "300"
        query: |
          max(aws_sqs_approximate_age_of_oldest_message_seconds{queue_name="t2s-eval"})
