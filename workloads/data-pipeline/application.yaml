---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-pipeline
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR-ORG/k8s-ai-ml-infra
    targetRevision: main
    path: workloads/data-pipeline
    directory:
      recurse: true
      exclude: 'application.yaml,README.md'
  destination:
    server: https://kubernetes.default.svc
    namespace: workloads
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
