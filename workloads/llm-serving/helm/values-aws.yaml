# AWS profile — assumes Terraform has applied (EKS + Karpenter + S3 bucket + IRSA).
cloud:
  provider: aws
  # Bootstrap renders these from `terraform output -json` into this file.
  modelBucketUri: "s3://ai-ml-infra-models"
  modelPullerSA: "arn:aws:iam::123456789012:role/ai-ml-infra-model-puller"

model:
  name: llama3-8b
  digest: "sha256:abcdef1234567890..."    # set by model-release GHA
  contextLength: 8192
  dtype: "bfloat16"

runtime:
  image: vllm/vllm-openai:v0.7.0   # CUDA build
  args:
    - --model=/models/$(MODEL_NAME)
    - --served-model-name=$(MODEL_NAME)
    - --max-num-seqs=64
    - --max-num-batched-tokens=8192
    - --enable-chunked-prefill
    - --enable-prefix-caching
    - --gpu-memory-utilization=0.90
    - --dtype=bfloat16

resources:
  requests:
    cpu: "4"
    memory: "16Gi"
    nvidia.com/gpu: "1"
  limits:
    cpu: "8"
    memory: "24Gi"
    nvidia.com/gpu: "1"

nodeSelector:
  workload-type: serving
  karpenter.k8s.aws/instance-gpu-count: "1"

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

rollout:
  replicas: 2
