apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-serving.name" . }}
  labels:
    {{- include "llm-serving.labels" . | nindent 4 }}
    {{- if eq .Values.cloud.provider "azure" }}
    azure.workload.identity/use: "true"
    {{- end }}
  annotations:
    {{- if eq .Values.cloud.provider "aws" }}
    eks.amazonaws.com/role-arn: {{ .Values.cloud.modelPullerSA | quote }}
    {{- else if eq .Values.cloud.provider "gcp" }}
    iam.gke.io/gcp-service-account: {{ .Values.cloud.modelPullerSA | quote }}
    {{- else if eq .Values.cloud.provider "azure" }}
    azure.workload.identity/client-id: {{ .Values.cloud.modelPullerSA | quote }}
    azure.workload.identity/tenant-id: {{ .Values.cloud.azureTenantId | quote }}
    {{- end }}
