---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voice-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/T2S/k8s-ai-ml-infra
    targetRevision: main
    path: workloads/voice-agent
    directory:
      exclude: "application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: t2s-voice
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
