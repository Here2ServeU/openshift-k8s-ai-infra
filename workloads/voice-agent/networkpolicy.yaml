---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-default-deny
  namespace: t2s-voice
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-worker-egress
  namespace: t2s-voice
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: t2s-worker-voice
  policyTypes:
    - Egress
  egress:
    # observability
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 9090
    # inference gateway (agent under test)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inference
      ports:
        - protocol: TCP
          port: 80
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # S3 / object storage for artifact upload + SQS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32   # block cloud metadata service (IMDSv1 SSRF guard)
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-worker-metrics-ingress
  namespace: t2s-voice
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: t2s-worker-voice
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 9090
