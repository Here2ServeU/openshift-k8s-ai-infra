---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: t2s-worker-voice
  namespace: t2s-voice
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/t2s-worker-voice
    iam.gke.io/gcp-service-account: t2s-worker-voice@PROJECT.iam.gserviceaccount.com
    azure.workload.identity/client-id: REPLACE_WITH_AZURE_CLIENT_ID
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t2s-worker-voice
  namespace: t2s-voice
  labels:
    app.kubernetes.io/name: t2s-worker-voice
    app.kubernetes.io/component: voice-worker
    app.kubernetes.io/part-of: t2s-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # Voice workers hold long-lived RTC sessions. maxUnavailable: 0 ensures we
  # never reduce capacity below desired while a rollout is in flight; the long
  # terminationGracePeriodSeconds lets active calls drain on pod exit.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: t2s-worker-voice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t2s-worker-voice
        app.kubernetes.io/component: voice-worker
        app.kubernetes.io/part-of: t2s-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: t2s-worker-voice
      terminationGracePeriodSeconds: 900
      nodeSelector:
        workload-type: voice
      tolerations:
        - key: workload-type
          operator: Equal
          value: voice
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: t2s-worker-voice
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/T2S/t2s-worker-voice:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
            - name: rtc
              containerPort: 7000
              protocol: UDP
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4317
            - name: OTEL_SERVICE_NAME
              value: t2s-worker-voice
            - name: EVAL_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: t2s-runtime
                  key: voice-queue-url
            - name: ARTIFACT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: t2s-runtime
                  key: artifact-bucket
            - name: LLM_GATEWAY_URL
              value: http://inference-gateway.inference.svc:80
            - name: PERSONA_CONFIG_PATH
              value: /etc/t2s/personas
            - name: MAX_CONCURRENT_CALLS_PER_POD
              value: "4"
            # graceful drain: stop claiming new calls this many seconds before SIGTERM
            - name: DRAIN_LEAD_SECONDS
              value: "600"
          volumeMounts:
            - name: personas
              mountPath: /etc/t2s/personas
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "/usr/local/bin/drain --lead=600"]
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: personas
          configMap:
            name: t2s-personas
---
apiVersion: v1
kind: Service
metadata:
  name: t2s-worker-voice
  namespace: t2s-voice
  labels:
    app.kubernetes.io/name: t2s-worker-voice
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: t2s-worker-voice
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: t2s-worker-voice
  namespace: t2s-voice
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: t2s-worker-voice
