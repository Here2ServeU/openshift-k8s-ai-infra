---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: t2s-worker-voice
  namespace: t2s-voice
  labels:
    app.kubernetes.io/name: t2s-worker-voice
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: t2s-worker-voice
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: app
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
