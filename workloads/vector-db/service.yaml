---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: vector-db
  labels:
    app.kubernetes.io/name: qdrant
spec:
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - { name: http, port: 6333, targetPort: http }
    - { name: grpc, port: 6334, targetPort: grpc }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  namespace: vector-db
  labels:
    app.kubernetes.io/name: qdrant
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - { name: p2p,  port: 6335, targetPort: p2p }
    - { name: http, port: 6333, targetPort: http }
    - { name: grpc, port: 6334, targetPort: grpc }
