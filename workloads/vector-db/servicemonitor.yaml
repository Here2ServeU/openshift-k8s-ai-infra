---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qdrant
  namespace: vector-db
  labels:
    app.kubernetes.io/name: qdrant
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
