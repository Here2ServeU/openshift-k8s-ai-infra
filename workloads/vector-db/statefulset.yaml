---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant
  namespace: vector-db
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/qdrant-snapshot-rw
    iam.gke.io/gcp-service-account: qdrant@PROJECT.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: vector-db
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: data-platform
spec:
  serviceName: qdrant-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "6333"
    spec:
      serviceAccountName: qdrant
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: qdrant
              topologyKey: topology.kubernetes.io/zone
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.11.3
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 6333 }
            - { name: grpc, containerPort: 6334 }
            - { name: p2p,  containerPort: 6335 }
          env:
            - name: QDRANT__CLUSTER__ENABLED
              value: "true"
            - name: QDRANT__CLUSTER__P2P__PORT
              value: "6335"
            - name: QDRANT__STORAGE__PERFORMANCE__OPTIMIZER_CPU_BUDGET
              value: "2"
            - name: QDRANT__SERVICE__ENABLE_TLS
              value: "false"
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
            - name: POD_INDEX
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "1",  memory: 4Gi }
            limits:   { cpu: "4",  memory: 16Gi }
          volumeMounts:
            - { name: storage, mountPath: /qdrant/storage }
            - { name: snapshots, mountPath: /qdrant/snapshots }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: snapshots
          emptyDir: { sizeLimit: 20Gi }
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
        storageClassName: gp3
