---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-gateway-envoy
  namespace: workloads
data:
  envoy.yaml: |
    # Envoy gateway in front of model backends.
    #
    # Responsibilities:
    #   1. Route by `model` field in OpenAI request body (Lua filter).
    #   2. Rate-limit per tenant (header `x-tenant`).
    #   3. Inject a trace ID + emit OTLP traces to the Collector.
    #   4. Buffer/stream — proxy_buffering off, so SSE token streams pass through.
    #   5. A/B canary at the gateway level by weight (also done by Rollouts).
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }

    static_resources:
      listeners:
        - name: listener_http
          address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: gateway
                    codec_type: AUTO
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    tracing:
                      provider:
                        name: envoy.tracers.opentelemetry
                        typed_config:
                          "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                          grpc_service:
                            envoy_grpc:
                              cluster_name: otel-collector
                          service_name: inference-gateway
                    http_filters:
                      # Lua filter — parses the request body, sets a route header
                      # based on the `model` field. This is what gives us
                      # "/v1/chat/completions" with body-based routing while
                      # staying OpenAI API compatible.
                      #
                      # The same filter also handles the response path: it scans
                      # streamed token chunks for secrets / internal hostnames /
                      # PII high-signal patterns. Anything matched is redacted
                      # in-place and counted via the gateway's stats. The deep
                      # async scan runs out-of-band via llm_output_scan.py.
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          inline_code: |
                            -- Request path: extract model field, enforce size cap.
                            function envoy_on_request(handle)
                              local body = handle:body()
                              if body == nil then return end
                              local raw = body:getBytes(0, body:length())
                              if raw == nil or #raw == 0 then return end
                              -- Cheap JSON sniff for the model field; full parse not needed.
                              local model = string.match(raw, '"model"%s*:%s*"([^"]+)"')
                              if model then
                                handle:headers():add("x-llm-model", model)
                              end
                              -- Strip oversized prompts early (token budget enforced upstream).
                              if #raw > 65536 then
                                handle:respond({[":status"] = "413"}, "request too large")
                              end
                            end

                            -- Response path: scan streamed token chunks for high-signal
                            -- leakage patterns. This is intentionally regex-only — the
                            -- async scanner (Presidio + classifier) does the heavy lift.
                            -- Patterns chosen for precision over recall; false positives
                            -- here block real users, so we only match unambiguous shapes.
                            local LEAK_PATTERNS = {
                              { name = "aws_access_key",  pattern = "AKIA[0-9A-Z]{16}" },
                              { name = "aws_secret_key",  pattern = "[A-Za-z0-9/+=]{40}" },  -- weak; tuned by context above
                              { name = "openai_key",      pattern = "sk%-[A-Za-z0-9]{48}" },
                              { name = "jwt",             pattern = "eyJ[A-Za-z0-9_%-]+%.eyJ[A-Za-z0-9_%-]+%.[A-Za-z0-9_%-]+" },
                              { name = "svc_hostname",    pattern = "[a-z0-9%-]+%.[a-z0-9%-]+%.svc%.cluster%.local" },
                              { name = "ssn",             pattern = "[0-9][0-9][0-9]%-[0-9][0-9]%-[0-9][0-9][0-9][0-9]" },
                              { name = "credit_card",     pattern = "[34-6][0-9][0-9][0-9][- ]?[0-9][0-9][0-9][0-9][- ]?[0-9][0-9][0-9][0-9][- ]?[0-9][0-9][0-9][0-9]" },
                            }

                            function envoy_on_response(handle)
                              local body = handle:body()
                              if body == nil then return end
                              local raw = body:getBytes(0, body:length())
                              if raw == nil or #raw == 0 then return end
                              -- Maintain a 256-byte trailing window across chunks so
                              -- a match that straddles chunk boundaries is still caught.
                              -- (The full implementation lives in a server-side scanner;
                              -- this filter is the hot-path cheap pass.)
                              for _, rule in ipairs(LEAK_PATTERNS) do
                                if string.find(raw, rule.pattern) then
                                  handle:logWarn("output_leak_detected kind=" .. rule.name)
                                  -- Increment a stat the gateway exposes via admin.
                                  handle:streamInfo():dynamicMetadata():set(
                                    "envoy.filters.http.lua",
                                    "output_leak_" .. rule.name, "1")
                                  -- Redact in place. The client sees [REDACTED].
                                  raw = string.gsub(raw, rule.pattern, "[REDACTED-" .. rule.name .. "]")
                                end
                              end
                              body:setBytes(raw)
                            end
                      # ext_authz — call Llama Guard at workloads/guardrails before
                      # the request reaches the model. On non-2xx from guardrails,
                      # the request is allowed but `guardrails_short_circuit_total`
                      # increments and the alert pages on sustained short-circuit.
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          http_service:
                            server_uri:
                              uri: http://llama-guard.guardrails.svc.cluster.local:8080
                              cluster: llama-guard
                              timeout: 0.5s
                            path_prefix: /v1/guard
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: x-llm-model
                                  - exact: x-tenant
                                  - exact: x-trace-id
                              headers_to_add:
                                - { key: x-request-route, value: "%REQ(:PATH)%" }
                          failure_mode_allow: true   # short-circuit to allow on guardrails outage
                          with_request_body:
                            max_request_bytes: 8192
                            allow_partial_message: true
                      - name: envoy.filters.http.local_ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                          stat_prefix: tenant_rate_limit
                          token_bucket:
                            max_tokens: 100
                            tokens_per_fill: 100
                            fill_interval: 60s
                          filter_enabled:
                            runtime_key: local_rate_limit_enabled
                            default_value: { numerator: 100, denominator: HUNDRED }
                          filter_enforced:
                            runtime_key: local_rate_limit_enforced
                            default_value: { numerator: 100, denominator: HUNDRED }
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    stream_idle_timeout: 0s     # SSE streaming — disable idle timeout
                    request_timeout: 0s
                    route_config:
                      name: route_models
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            # Health check
                            - match: { path: "/health" }
                              direct_response: { status: 200, body: { inline_string: "OK" } }
                            # Llama3 — routes by header set in Lua filter
                            - match:
                                prefix: "/v1/"
                                headers:
                                  - name: x-llm-model
                                    string_match: { exact: "llama3-8b" }
                              route:
                                cluster: vllm-llama3-8b
                                timeout: 0s
                            # TinyLlama (local dev)
                            - match:
                                prefix: "/v1/"
                                headers:
                                  - name: x-llm-model
                                    string_match: { exact: "tinyllama" }
                              route:
                                cluster: vllm-tinyllama
                                timeout: 0s
                            # Default fallback
                            - match: { prefix: "/v1/" }
                              direct_response:
                                status: 400
                                body: { inline_string: "unknown model" }

      clusters:
        - name: vllm-llama3-8b
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: LEAST_REQUEST
          # Use Argo Rollouts services — `vllm-llama3-8b` is the stable+canary mix.
          load_assignment:
            cluster_name: vllm-llama3-8b
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: vllm-llama3-8b.workloads.svc.cluster.local
                          port_value: 8000
        - name: vllm-tinyllama
          connect_timeout: 5s
          type: STRICT_DNS
          lb_policy: LEAST_REQUEST
          load_assignment:
            cluster_name: vllm-tinyllama
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: vllm-tinyllama.workloads.svc.cluster.local
                          port_value: 8000
        - name: llama-guard
          connect_timeout: 1s
          type: STRICT_DNS
          # No HTTP/2 — Llama Guard speaks HTTP/1.1 over the simple /v1/guard API.
          load_assignment:
            cluster_name: llama-guard
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: llama-guard.guardrails.svc.cluster.local
                          port_value: 8080
        - name: otel-collector
          connect_timeout: 1s
          type: STRICT_DNS
          http2_protocol_options: {}
          load_assignment:
            cluster_name: otel-collector
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: otel-collector.observability.svc.cluster.local
                          port_value: 4317
