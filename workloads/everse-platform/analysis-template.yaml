---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: everse-api-canary
  namespace: everse
spec:
  metrics:
    - name: api-error-rate
      interval: 30s
      count: 10
      successCondition: result[0] < 0.01
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-operated.observability:9090
          query: |
            sum(rate(http_server_requests_total{service_name="everse-api",status=~"5.."}[2m]))
            /
            clamp_min(sum(rate(http_server_requests_total{service_name="everse-api"}[2m])), 1)
    - name: api-p95-latency
      interval: 30s
      count: 10
      successCondition: result[0] < 0.5
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-operated.observability:9090
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_duration_seconds_bucket{service_name="everse-api"}[2m]))
            )
