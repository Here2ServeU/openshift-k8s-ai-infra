---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: everse-runtime
  namespace: everse
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: workload-secrets
    kind: ClusterSecretStore
  target:
    name: everse-runtime
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: /everse/prod/database-url
    - secretKey: redis-url
      remoteRef:
        key: /everse/prod/redis-url
    - secretKey: eval-queue-url
      remoteRef:
        key: /everse/prod/eval-queue-url
    - secretKey: artifact-bucket
      remoteRef:
        key: /everse/prod/artifact-bucket
