---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: everse-api
  namespace: everse
  labels:
    app.kubernetes.io/name: everse-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: everse-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: everse-api
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 10
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 10m
      analysis:
        templates:
          - templateName: everse-api-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: everse-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: everse-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: everse-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/your-org/everse-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4317
            - name: OTEL_SERVICE_NAME
              value: everse-api
            - name: EVAL_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: everse-runtime
                  key: eval-queue-url
            - name: ARTIFACT_BUCKET
              valueFrom:
                secretKeyRef:
                  name: everse-runtime
                  key: artifact-bucket
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: everse-runtime
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: everse-runtime
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: everse-api
  namespace: everse
  labels:
    app.kubernetes.io/name: everse-api
spec:
  selector:
    app.kubernetes.io/name: everse-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: everse-api
  namespace: everse
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: everse-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: everse-api
  namespace: everse
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: everse-api
