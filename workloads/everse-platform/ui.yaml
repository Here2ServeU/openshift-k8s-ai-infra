---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: everse-ui
  namespace: everse
  labels:
    app.kubernetes.io/name: everse-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: everse-platform
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: everse-ui
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause:
            duration: 5m
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: everse-ui
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: everse-platform
    spec:
      serviceAccountName: everse-ui
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/your-org/everse-ui:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: /api
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: everse-ui
  namespace: everse
  labels:
    app.kubernetes.io/name: everse-ui
spec:
  selector:
    app.kubernetes.io/name: everse-ui
  ports:
    - name: http
      port: 80
      targetPort: http
