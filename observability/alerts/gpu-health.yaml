---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-health
  namespace: observability
  labels:
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
spec:
  groups:
    - name: gpu-health
      rules:
        - alert: GPUXIDError
          # XID errors are NVIDIA driver-level events; non-recoverable ones (74, 79)
          # require node replacement.
          expr: increase(DCGM_FI_DEV_XID_ERRORS[10m]) > 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "GPU XID error on {{ $labels.Hostname }} (gpu {{ $labels.gpu }})"
            description: "XID errors indicate hardware/driver faults. Cordon the node and replace."
            runbook_url: "https://github.com/YOUR-ORG/k8s-ai-ml-infra/blob/main/docs/runbooks/gpu-node-not-ready.md"

        - alert: GPUMemoryUsageHigh
          expr: DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL > 0.95
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "GPU memory > 95% on {{ $labels.Hostname }}"
            description: "OOM risk. Reduce max-num-seqs or scale out."

        - alert: GPUIdleButProvisioned
          # Cost guard — a GPU node sitting idle for >30m is wasted spend.
          expr: avg_over_time(DCGM_FI_DEV_GPU_UTIL[30m]) < 5
          for: 30m
          labels:
            severity: warning
            team: platform
            category: cost
          annotations:
            summary: "Idle GPU on {{ $labels.Hostname }} for 30m"
            description: "Karpenter should consolidate this — check the NodePool consolidation policy."
            runbook_url: "https://github.com/YOUR-ORG/k8s-ai-ml-infra/blob/main/docs/runbooks/cost-spike.md"

        - alert: GPUTemperatureHigh
          expr: DCGM_FI_DEV_GPU_TEMP > 85
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "GPU temp > 85°C on {{ $labels.Hostname }}"
            description: "Sustained high temperature can throttle and degrade lifetime."
