kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-ml-infra
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    labels:
      workload-type: serving
  - role: worker
    labels:
      workload-type: serving
  - role: worker
    labels:
      workload-type: batch
networking:
  # Required for Cilium / NetworkPolicy demos
  disableDefaultCNI: false
  apiServerAddress: "127.0.0.1"
